
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas, Please Don't Call</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at center, #a51d32, #650d1c 65%, #27050c);
  color: white;
  font-family: 'DM Sans', sans-serif;
}

.container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  position: relative;
}

.top {
  position: absolute;
  top: 35px;
  font-size: 10px;
  letter-spacing: 5px;
  color: #f3c5ca;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(38px, 8vw, 68px);
  font-weight: 400;
}

.subtitle {
  color: #f1b5bd;
  font-size: 11px;
  letter-spacing: 5px;
  margin-top: 5px;
}

.lyric-stage {
  position: relative;
  width: 100%;
  height: 260px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 30px;
  overflow: hidden;
}

.bubble {
  position: absolute;
  max-width: 85%;
  padding: 20px 26px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 25px;
  background: rgba(255,255,255,.10);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 40px rgba(0,0,0,.15);
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(21px, 4.5vw, 33px);
  line-height: 1.4;
  animation: floatUp var(--duration) linear forwards;
}

@keyframes floatUp {
  0% {
    opacity: 0;
    transform: translateY(65px) scale(.94);
    filter: blur(5px);
  }
  12% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
  75% {
    opacity: 1;
    transform: translateY(-40px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-110px) scale(.96);
    filter: blur(3px);
  }
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 30px;
}

button {
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(255,255,255,.1);
  color: white;
  padding: 12px 22px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 12px;
  transition: .3s;
}

button:hover {
  background: rgba(255,255,255,.25);
}

.progress {
  width: 220px;
  height: 3px;
  background: rgba(255,255,255,.2);
  border-radius: 10px;
  margin-top: 25px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: white;
}

.time {
  margin-top: 10px;
  font-size: 11px;
  color: #f5c5cb;
}

.footer {
  position: absolute;
  bottom: 28px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #eab5bd;
}

/* Snow */
.snow {
  position: fixed;
  top: -20px;
  color: white;
  pointer-events: none;
  z-index: 5;
  animation: snowfall linear infinite;
}

@keyframes snowfall {
  to {
    transform: translate(45px, 110vh) rotate(360deg);
  }
}

@media(max-width:500px) {
  .lyric-stage {
    height: 250px;
  }
  .controls {
    gap: 6px;
  }
  button {
    padding: 11px 15px;
  }
}
</style>
</head>

<body>

<div id="snow"></div>

<main class="container">

  <div class="top">A CHRISTMAS MEMORY</div>

  <h1>Merry Christmas</h1>
  <div class="subtitle">PLEASE DON'T CALL</div>

  <div class="lyric-stage" id="stage">
    <p style="color:#f3c5ca;font-size:13px">
      Press play to begin...
    </p>
  </div>

  <div class="controls">
    <button onclick="play()">▶ PLAY</button>
    <button onclick="pause()">Ⅱ PAUSE</button>
    <button onclick="restart()">↻ RESTART</button>
  </div>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="time" id="time">00:00</div>

  <div class="footer">SOME MEMORIES NEVER FADE</div>

</main>

<script>

// =================================
// 1. LYRICS + DURASI SETIAP BAIT
// =================================

// Format: ["Lirik", durasi dalam detik]

const lyrics = [
  ["Oh, golden boy, don't act like you were kind", 4.5],
  ["You were mine, but you were awful every time", 4.5],
  ["So don't tell them what you told me", 3.5],
  ["Don't hold me like you know me", 3.2],
  ["I would rather burn forever", 3.5],
  ["But you should know that I died slow", 3.8],
  ["Running through the halls of your haunted home", 4.5],
  ["And the toughest part is that we both know", 4.2],
  ["What happened to you", 2.2],
  ["Why you're out on your own", 2.5],
  ["Merry Christmas, please don't call", 4.5]
];

// Total waktu dihitung otomatis
const totalDuration = lyrics.reduce(
  (sum, item) => sum + item[1], 0
);

// =================================
// 2. SNOW EFFECT
// =================================

const snow = document.getElementById("snow");

for (let i = 0; i < 65; i++) {
  const flake = document.createElement("div");

  flake.className = "snow";
  flake.textContent = Math.random() > .5 ? "❄" : "•";

  flake.style.left = Math.random() * 100 + "vw";
  flake.style.fontSize = (Math.random() * 10 + 5) + "px";
  flake.style.opacity = Math.random() * .7 + .2;
  flake.style.animationDuration = (Math.random() * 8 + 6) + "s";
  flake.style.animationDelay = (Math.random() * -15) + "s";

  snow.appendChild(flake);
}

// =================================
// 3. LYRIC ENGINE
// =================================

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const timeDisplay = document.getElementById("time");

let index = 0;
let remaining = 0;
let playing = false;
let timer = null;
let lastStart = 0;
let elapsed = 0;
let activeBubble = null;

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return String(min).padStart(2, "0") + ":" +
         String(sec).padStart(2, "0");
}

function showLyric() {
  const [text, duration] = lyrics[index];

  if (activeBubble) {
    activeBubble.remove();
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  bubble.style.setProperty(
    "--duration", duration + "s"
  );

  stage.appendChild(bubble);
  activeBubble = bubble;
}

function nextLyric() {
  index++;

  if (index >= lyrics.length) {
    pause();
    return;
  }

  showLyric();
  remaining = lyrics[index][1];

  lastStart = Date.now();

  timer = setTimeout(nextLyric, remaining * 1000);
}

function updateProgress() {
  const progress = (elapsed / totalDuration) * 100;
  bar.style.width = Math.min(progress, 100) + "%";
  timeDisplay.textContent = formatTime(elapsed);
}

function play() {
  if (playing || index >= lyrics.length) return;

  playing = true;

  if (index === 0 && remaining === 0) {
    showLyric();
    remaining = lyrics[0][1];
  }

  lastStart = Date.now();

  timer = setTimeout(nextLyric, remaining * 1000);

  // Update progress continuously
  progressLoop();
}

function progressLoop() {
  if (!playing) return;

  elapsed = totalDuration -
    (remaining + lyrics.slice(index + 1)
      .reduce((sum, item) => sum + item[1], 0));

  elapsed += (Date.now() - lastStart) / 1000;

  updateProgress();

  if (playing) {
    requestAnimationFrame(progressLoop);
  }
}

function pause() {
  if (!playing) return;

  const passed = (Date.now() - lastStart) / 1000;

  remaining = Math.max(0, remaining - passed);

  clearTimeout(timer);
  playing = false;

  if (activeBubble) {
    activeBubble.style.animationPlayState = "paused";
  }
}

function restart() {
  clearTimeout(timer);

  playing = false;
  index = 0;
  remaining = 0;
  elapsed = 0;

  if (activeBubble) activeBubble.remove();

  activeBubble = null;

  bar.style.width = "0%";
  timeDisplay.textContent = "00:00";

  play();
}

</script>

</body>
</html>

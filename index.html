
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas - Please Don't Call</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%,
    #a51d32 0%, #710f21 55%, #29050d 100%);
  color: white;
  font-family: 'DM Sans', sans-serif;
}

/* BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(
    circle, transparent 20%, rgba(0,0,0,.25) 100%
  );
  pointer-events: none;
  z-index: 1;
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.snowflake {
  position: absolute;
  top: -20px;
  color: white;
  animation: snowfall linear infinite;
  opacity: .65;
}

@keyframes snowfall {
  to {
    transform: translate(40px, 110vh) rotate(360deg);
  }
}

/* MAIN */

.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  width: 100%;
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.top-label {
  position: absolute;
  top: 35px;
  font-size: 10px;
  letter-spacing: 5px;
  color: #f5c4ca;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 8vw, 70px);
  font-weight: 400;
  text-align: center;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 5px;
  color: #f4b9c1;
  margin-top: 5px;
}

/* LYRICS */

.lyric-stage {
  width: 100%;
  max-width: 750px;
  height: 300px;
  margin-top: 30px;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;

  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;

  scrollbar-width: none;
  mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    black 12%,
    black 100%
  );
}

.lyric-stage::-webkit-scrollbar {
  display: none;
}

.bubble {
  flex-shrink: 0;
  width: fit-content;
  max-width: 90%;

  padding: 15px 22px;

  border: 1px solid rgba(255,255,255,.3);
  border-radius: 24px;

  background: rgba(255,255,255,.10);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: 0 8px 30px rgba(0,0,0,.12);

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(19px, 4.2vw, 29px);
  line-height: 1.35;
  text-align: center;

  opacity: 1;
  animation: bubbleRise .9s ease-out forwards;
}

@keyframes bubbleRise {
  from {
    transform: translateY(35px);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* CONTROLS */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}

button {
  padding: 12px 20px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 30px;
  background: rgba(255,255,255,.1);
  color: white;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: rgba(255,255,255,.25);
  transform: translateY(-2px);
}

button:active {
  transform: scale(.95);
}

.progress {
  width: min(230px, 65vw);
  height: 3px;
  margin-top: 24px;
  background: rgba(255,255,255,.2);
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: white;
}

.time {
  margin-top: 10px;
  font-size: 11px;
  color: #f5c4ca;
}

.footer {
  position: absolute;
  bottom: 27px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #eab5bd;
  opacity: .7;
}

@media(max-width: 500px) {
  .lyric-stage {
    height: 290px;
  }

  .bubble {
    padding: 13px 17px;
  }

  .controls {
    gap: 6px;
  }

  button {
    padding: 11px 14px;
  }
}
</style>
</head>

<body>

<div id="snow"></div>

<main class="container">

  <div class="top-label">
    A CHRISTMAS MEMORY
  </div>

  <h1>Merry Christmas</h1>
  <div class="subtitle">PLEASE DON'T CALL</div>

  <div class="lyric-stage" id="stage">
    <div style="color:#f5c4ca;font-size:13px">
      Press play to begin...
    </div>
  </div>

  <div class="controls">
    <button onclick="playLyrics()">▶ PLAY</button>
    <button onclick="pauseLyrics()">Ⅱ PAUSE</button>
    <button onclick="restartLyrics()">↻ RESTART</button>
  </div>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="time" id="time">00:00</div>

  <div class="footer">
    SOME MEMORIES NEVER FADE
  </div>

</main>

<script>

// ======================================
// 1. LYRICS + DURASI SETIAP BAIT
// ======================================

// Format: ["Lirik", durasi dalam detik]

const lyrics = [

  ["Oh, golden boy, don't act like you were kind", 4.5],

  ["You were mine, but you were awful every time", 4.5],

  ["So don't tell them what you told me", 3.5],

  ["Don't hold me like you know me", 3.2],

  ["I would rather burn forever", 3.5],

  ["But you should know that I died slow", 3.8],

  ["Running through the halls of your haunted home", 4.5],

  ["And the toughest part is that we both know", 4.2],

  ["What happened to you", 2.2],

  ["Why you're out on your own", 2.5],

  ["Merry Christmas, please don't call", 4.5]

];

// ======================================
// 2. SNOW GENERATOR
// ======================================

const snow = document.getElementById("snow");

for (let i = 0; i < 65; i++) {

  const flake = document.createElement("div");

  flake.className = "snowflake";
  flake.textContent = Math.random() > .5 ? "❄" : "•";

  flake.style.left = Math.random() * 100 + "vw";
  flake.style.fontSize =
    (Math.random() * 10 + 5) + "px";

  flake.style.animationDuration =
    (Math.random() * 8 + 6) + "s";

  flake.style.animationDelay =
    (Math.random() * -15) + "s";

  snow.appendChild(flake);
}

// ======================================
// 3. LYRIC ENGINE
// ======================================

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const timeDisplay = document.getElementById("time");

let index = 0;
let remaining = 0;
let playing = false;
let timer = null;
let lastStart = 0;
let elapsedBefore = 0;

const totalDuration = lyrics.reduce(
  (sum, item) => sum + item[1], 0
);

function formatTime(seconds) {

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return String(min).padStart(2, "0") +
    ":" +
    String(sec).padStart(2, "0");
}

// ======================================
// 4. SHOW LYRICS
// ======================================

function showLyric() {

  const text = lyrics[index][0];

  const bubble = document.createElement("div");

  bubble.className = "bubble";
  bubble.textContent = text;

  stage.appendChild(bubble);

  // Scroll ke lirik terbaru
  requestAnimationFrame(() => {
    stage.scrollTo({
      top: stage.scrollHeight,
      behavior: "smooth"
    });
  });

}

// ======================================
// 5. NEXT LYRIC
// ======================================

function nextLyric() {

  elapsedBefore += remaining;

  index++;

  if (index >= lyrics.length) {

    playing = false;
    remaining = 0;

    updateProgress(totalDuration);

    return;
  }

  showLyric();

  remaining = lyrics[index][1];
  lastStart = Date.now();

  timer = setTimeout(nextLyric, remaining * 1000);

}

// ======================================
// 6. PROGRESS BAR
// ======================================

let progressFrame = null;

function updateProgress(elapsed) {

  const percent = Math.min(
    (elapsed / totalDuration) * 100,
    100
  );

  bar.style.width = percent + "%";
  timeDisplay.textContent = formatTime(elapsed);

}

function progressLoop() {

  if (!playing) return;

  const passed = (Date.now() - lastStart) / 1000;

  const currentElapsed =
    elapsedBefore + passed;

  updateProgress(currentElapsed);

  progressFrame = requestAnimationFrame(progressLoop);

}

// ======================================
// 7. PLAY
// ======================================

function playLyrics() {

  if (playing || index >= lyrics.length) return;

  playing = true;

  if (remaining === 0) {

    showLyric();
    remaining = lyrics[index][1];

  }

  lastStart = Date.now();

  timer = setTimeout(
    nextLyric,
    remaining * 1000
  );

  progressLoop();

}

// ======================================
// 8. PAUSE
// ======================================

function pauseLyrics() {

  if (!playing) return;

  const passed = (Date.now() - lastStart) / 1000;

  remaining = Math.max(0, remaining - passed);

  clearTimeout(timer);

  cancelAnimationFrame(progressFrame);

  playing = false;

}

// ======================================
// 9. RESTART
// ======================================

function restartLyrics() {

  clearTimeout(timer);
  cancelAnimationFrame(progressFrame);

  playing = false;

  index = 0;
  remaining = 0;
  elapsedBefore = 0;

  stage.innerHTML = "";

  bar.style.width = "0%";
  timeDisplay.textContent = "00:00";

  playLyrics();

}

</script>

</body>
</html>

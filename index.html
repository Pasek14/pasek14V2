
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merry Christmas, Please Don't Call</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  color: white;
  font-family: 'DM Sans', sans-serif;

  background:
    radial-gradient(
      circle at 50% 40%,
      #a51d32 0%,
      #710f21 55%,
      #29050d 100%
    );
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(
    circle,
    transparent 20%,
    rgba(0,0,0,.25) 100%
  );
  pointer-events: none;
  z-index: 1;
}

/* SNOW */

#snow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.snowflake {
  position: absolute;
  top: -20px;
  color: white;
  animation: snowfall linear infinite;
  opacity: .65;
}

@keyframes snowfall {
  to {
    transform: translate(40px, 110vh) rotate(360deg);
  }
}

/* MAIN CONTAINER */

.container {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100vh;

  padding: 25px 18px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.top-label {
  position: absolute;
  top: 35px;

  font-size: 10px;
  letter-spacing: 5px;
  color: #f5c4ca;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 8vw, 70px);
  font-weight: 400;
  text-align: center;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 5px;
  color: #f4b9c1;
  margin-top: 5px;
}

/* LYRIC AREA */

.lyric-stage {
  position: relative;

  width: 100%;
  max-width: 750px;
  height: 350px;

  margin-top: 25px;

  overflow: hidden;
}

/* BUBBLE */

.bubble {
  position: absolute;

  left: 50%;
  bottom: 5px;

  width: fit-content;
  max-width: min(82%, 570px);

  padding: 14px 21px;

  border: 1px solid rgba(255,255,255,.3);
  border-radius: 25px;

  background: rgba(255,255,255,.11);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: 0 8px 30px rgba(0,0,0,.12);

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(19px, 4vw, 28px);
  line-height: 1.35;
  text-align: center;

  opacity: 1;

  transform:
    translateX(calc(-50% + var(--offset)));

  animation:
    floatBubble var(--travel-time) cubic-bezier(.25,.1,.25,1) forwards;
}

/* SLOW FLOATING */

@keyframes floatBubble {

  0% {
    transform:
      translate(calc(-50% + var(--offset)), 0);
  }

  25% {
    transform:
      translate(calc(-50% + var(--offset) + 5px), -20px);
  }

  50% {
    transform:
      translate(calc(-50% + var(--offset) - 5px), -50px);
  }

  75% {
    transform:
      translate(calc(-50% + var(--offset) + 3px), -85px);
  }

  100% {
    transform:
      translate(calc(-50% + var(--offset)), -125px);
  }
}

/* CONTROLS */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

button {
  padding: 12px 20px;

  border: 1px solid rgba(255,255,255,.4);
  border-radius: 30px;

  background: rgba(255,255,255,.1);
  color: white;

  font-size: 11px;
  letter-spacing: 1px;

  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: rgba(255,255,255,.25);
  transform: translateY(-2px);
}

button:active {
  transform: scale(.95);
}

/* PROGRESS */

.progress {
  width: min(230px, 65vw);
  height: 3px;

  margin-top: 22px;

  background: rgba(255,255,255,.2);
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: white;
}

.time {
  margin-top: 10px;
  font-size: 11px;
  color: #f5c4ca;
}

.footer {
  position: absolute;
  bottom: 27px;

  font-size: 10px;
  letter-spacing: 3px;
  color: #eab5bd;
  opacity: .7;
}

/* MOBILE */

@media(max-width: 500px) {

  .lyric-stage {
    height: 350px;
  }

  .bubble {
    max-width: 86%;
    padding: 12px 16px;
  }

  .controls {
    gap: 6px;
  }

  button {
    padding: 11px 14px;
  }
}

</style>
</head>

<body>

<div id="snow"></div>

<main class="container">

  <div class="top-label">
    A CHRISTMAS MEMORY
  </div>

  <h1>Merry Christmas</h1>

  <div class="subtitle">
    PLEASE DON'T CALL
  </div>

  <div class="lyric-stage" id="stage"></div>

  <div class="controls">

    <button onclick="playLyrics()">
      ▶ PLAY
    </button>

    <button onclick="pauseLyrics()">
      Ⅱ PAUSE
    </button>

    <button onclick="restartLyrics()">
      ↻ RESTART
    </button>

  </div>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="time" id="time">
    00:00
  </div>

  <div class="footer">
    SOME MEMORIES NEVER FADE
  </div>

</main>

<script>

// ======================================
// 1. LYRICS + TIMING
// ======================================

// Format:
// ["Lirik", waktu mulai, waktu selesai]

const lyrics = [

  ["I would rather burn forever", 1, 3],

  ["But you should know", 3, 5],

  ["that I died slow", 5, 8],

  ["Running through the halls of your haunted home", 8, 12],

  ["And the toughest part", 12, 14],

  ["is that we both know", 14, 16],

  ["What happened to you", 16, 18],

  ["Why you're out on your own", 18, 21],

  ["Merry Christmas", 21, 23],

  ["please don't call", 23, 28]

];

const totalDuration = 28;


// ======================================
// 2. SNOW GENERATOR
// ======================================

const snow = document.getElementById("snow");

for (let i = 0; i < 65; i++) {

  const flake = document.createElement("div");

  flake.className = "snowflake";

  flake.textContent =
    Math.random() > .5 ? "❄" : "•";

  flake.style.left =
    Math.random() * 100 + "vw";

  flake.style.fontSize =
    (Math.random() * 10 + 5) + "px";

  flake.style.animationDuration =
    (Math.random() * 8 + 6) + "s";

  flake.style.animationDelay =
    (Math.random() * -15) + "s";

  snow.appendChild(flake);

}


// ======================================
// 3. VARIABLES
// ======================================

const stage = document.getElementById("stage");

const bar = document.getElementById("bar");

const timeDisplay = document.getElementById("time");

let playing = false;

let elapsed = 0;

let startTime = 0;

let index = 0;

let frame = null;

let bubbles = [];


// ======================================
// 4. RANDOM HORIZONTAL POSITION
// ======================================

function randomPosition() {

  const positions = [
    -75,
    -40,
    0,
    40,
    75
  ];

  return positions[
    Math.floor(Math.random() * positions.length)
  ];

}


// ======================================
// 5. CREATE BUBBLE
// ======================================

function showLyric(text, duration) {

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  // Random position
  const offset = randomPosition();

  bubble.style.setProperty(
    "--offset",
    offset + "px"
  );

  // Movement speed follows lyric duration
  bubble.style.setProperty(
    "--travel-time",
    duration + "s"
  );

  stage.appendChild(bubble);

  // Store animation for pause and resume
  const animation = bubble.getAnimations()[0];

  bubbles.push(animation);

}


// ======================================
// 6. UPDATE LYRICS
// ======================================

function updateLyrics() {

  if (!playing) return;

  elapsed = (Date.now() - startTime) / 1000;

  // Check lyric timing
  while (
    index < lyrics.length &&
    elapsed >= lyrics[index][1]
  ) {

    const text = lyrics[index][0];

    const duration =
      lyrics[index][2] - lyrics[index][1];

    showLyric(text, duration);

    index++;

  }

  // Progress bar
  bar.style.width =
    Math.min(
      elapsed / totalDuration * 100,
      100
    ) + "%";

  timeDisplay.textContent =
    formatTime(elapsed);

  if (elapsed >= totalDuration) {

    pauseLyrics();

    return;

  }

  frame = requestAnimationFrame(updateLyrics);

}


// ======================================
// 7. TIME FORMAT
// ======================================

function formatTime(seconds) {

  const min = Math.floor(seconds / 60);

  const sec = Math.floor(seconds % 60);

  return (
    String(min).padStart(2, "0") +
    ":" +
    String(sec).padStart(2, "0")
  );

}


// ======================================
// 8. PLAY
// ======================================

function playLyrics() {

  if (playing || elapsed >= totalDuration) return;

  playing = true;

  startTime = Date.now() - elapsed * 1000;

  // Resume existing bubble animations
  bubbles.forEach(animation => {
    if (animation.playState === "paused") {
      animation.play();
    }
  });

  updateLyrics();

}


// ======================================
// 9. PAUSE
// ======================================

function pauseLyrics() {

  if (!playing) return;

  elapsed = (Date.now() - startTime) / 1000;

  playing = false;

  cancelAnimationFrame(frame);

  // Freeze all bubbles
  bubbles.forEach(animation => {
    animation.pause();
  });

}


// ======================================
// 10. RESTART
// ======================================

function restartLyrics() {

  playing = false;

  cancelAnimationFrame(frame);

  bubbles.forEach(animation => {
    animation.cancel();
  });

  bubbles = [];

  elapsed = 0;

  index = 0;

  stage.innerHTML = "";

  bar.style.width = "0%";

  timeDisplay.textContent = "00:00";

  playLyrics();

}

</script>

</body>
</html>

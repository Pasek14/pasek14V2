
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas, Please Don't Call</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #a51c32 0%, #74101f 48%, #350810 100%);
  color: white;
  font-family: 'DM Sans', sans-serif;
}

/* Background glow */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center,
    transparent 10%, rgba(20,0,5,.35) 100%);
  pointer-events: none;
  z-index: 1;
}

/* Snow */
.snow {
  position: fixed;
  top: -15px;
  color: white;
  pointer-events: none;
  z-index: 2;
  animation: snowfall linear infinite;
  opacity: .8;
}

@keyframes snowfall {
  0% {
    transform: translateY(-10vh) translateX(0) rotate(0);
    opacity: 0;
  }
  10% { opacity: .8; }
  90% { opacity: .7; }
  100% {
    transform: translateY(110vh) translateX(50px) rotate(360deg);
    opacity: 0;
  }
}

/* Main layout */
.container {
  height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 3;
  padding: 25px;
}

.top-label {
  position: absolute;
  top: 35px;
  text-align: center;
  letter-spacing: 5px;
  font-size: 10px;
  color: #f2c4c9;
  opacity: .8;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 7vw, 65px);
  font-weight: 400;
  text-align: center;
  letter-spacing: 1px;
  text-shadow: 0 3px 30px rgba(0,0,0,.2);
}

.subtitle {
  color: #efb9c0;
  font-size: 12px;
  letter-spacing: 3px;
  margin-top: 10px;
}

/* Lyrics area */
.lyrics-area {
  position: relative;
  width: 100%;
  height: 260px;
  margin-top: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bubble {
  position: absolute;
  max-width: min(85%, 650px);
  padding: 18px 28px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.09);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 25px;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 4vw, 32px);
  text-align: center;
  line-height: 1.4;
  box-shadow: 0 10px 40px rgba(30,0,0,.15);
  animation: bubbleRise 4.5s ease forwards;
}

@keyframes bubbleRise {
  0% {
    opacity: 0;
    transform: translateY(65px) scale(.92);
    filter: blur(5px);
  }
  15% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
  70% {
    opacity: 1;
    transform: translateY(-35px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-115px) scale(.96);
    filter: blur(3px);
  }
}

/* Controls */
.controls {
  display: flex;
  gap: 12px;
  margin-top: 35px;
}

button {
  padding: 12px 25px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.1);
  color: white;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: rgba(255,255,255,.25);
  transform: translateY(-2px);
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.footer {
  position: absolute;
  bottom: 28px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #eab3ba;
  opacity: .65;
}

/* Progress */
.progress {
  width: min(220px, 60vw);
  height: 2px;
  background: rgba(255,255,255,.2);
  margin-top: 25px;
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #fff;
  transition: width .3s linear;
}

@media(max-width: 500px) {
  .lyrics-area { height: 240px; }
  .bubble { padding: 15px 20px; }
}
</style>
</head>

<body>

<div id="snow-container"></div>

<main class="container">

  <div class="top-label">A WINTER MEMORY · 2026</div>

  <h1>Merry Christmas</h1>
  <div class="subtitle">please don't call</div>

  <div class="lyrics-area" id="lyricsArea">
    <div style="color:#f1c4ca; font-size:13px; letter-spacing:2px;">
      Press play to begin...
    </div>
  </div>

  <div class="controls">
    <button onclick="startLyrics()" id="playBtn">▶ PLAY</button>
    <button onclick="pauseLyrics()">Ⅱ PAUSE</button>
    <button onclick="restartLyrics()">↻ RESTART</button>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="footer">SOME MEMORIES NEVER FADE</div>

</main>

<script>
// Snow generator
const snowContainer = document.getElementById('snow-container');

for (let i = 0; i < 65; i++) {
  const snow = document.createElement('div');
  snow.className = 'snow';
  snow.innerHTML = Math.random() > .5 ? '❄' : '•';

  snow.style.left = Math.random() * 100 + 'vw';
  snow.style.fontSize = (Math.random() * 9 + 4) + 'px';
  snow.style.animationDuration = (Math.random() * 8 + 6) + 's';
  snow.style.animationDelay = (Math.random() * 10) + 's';

  snowContainer.appendChild(snow);
}

// Lyrics
const lyrics = [
  { text: "Oh, golden boy, don't act like you were kind", time: 0 },
  { text: "You were mine, but you were awful every time", time: 5 },
  { text: "So don't tell them what you told me", time: 10 },
  { text: "Don't hold me like you know me", time: 14 },
  { text: "I would rather burn forever", time: 18 },
  { text: "But you should know that I died slow", time: 22 },
  { text: "Running through the halls of your haunted home", time: 27 },
  { text: "And the toughest part is that we both know", time: 32 },
  { text: "What happened to you", time: 37 },
  { text: "Why you're out on your own", time: 41 },
  { text: "Merry Christmas, please don't call", time: 46 }
];

// Timing in seconds.
// Adjust these values to match your audio.

const lyricsArea = document.getElementById('lyricsArea');
const progress = document.getElementById('progress');

let current = 0;
let elapsed = 0;
let playing = false;
let timer = null;
let startTime = 0;

function showLyric(text) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  lyricsArea.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, 4500);
}

function updateLyrics() {
  const now = (Date.now() - startTime) / 1000;

  while (
    current < lyrics.length &&
    now >= lyrics[current].time
  ) {
    showLyric(lyrics[current].text);
    current++;
  }

  const duration = 50;
  progress.style.width =
    Math.min((now / duration) * 100, 100) + '%';

  if (now >= duration && current >= lyrics.length) {
    pauseLyrics();
    return;
  }
}

function startLyrics() {
  if (playing) return;

  playing = true;
  startTime = Date.now() - elapsed * 1000;

  updateLyrics();
  timer = setInterval(updateLyrics, 100);
}

function pauseLyrics() {
  if (!playing) return;

  elapsed = (Date.now() - startTime) / 1000;
  playing = false;
  clearInterval(timer);
}

function restartLyrics() {
  pauseLyrics();

  current = 0;
  elapsed = 0;
  startTime = 0;

  lyricsArea.innerHTML = `
    <div style="color:#f1c4ca;font-size:13px;letter-spacing:2px;">
      Press play to begin...
    </div>`;

  progress.style.width = '0%';

  startLyrics();
}
</script>

</body>
</html>

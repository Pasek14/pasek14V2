
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas - Bleachers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  color: white;
  font-family: Georgia, serif;
  background:
    radial-gradient(ellipse at 50% 15%, #8d1725 0%, transparent 55%),
    linear-gradient(160deg, #210609, #510b16 55%, #170306);
}

.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 35px 16px 20px;
}

.heading {
  flex-shrink: 0;
  text-align: center;
  margin-bottom: 15px;
}

.heading h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 55px);
  font-weight: normal;
  letter-spacing: 2px;
  text-shadow: 0 0 20px #ff5268;
}

.heading .song {
  margin: 9px 0 0;
  color: #f4c2c9;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 5px;
}

.heading .artist {
  margin: 9px 0 0;
  color: #d89aa5;
  font-size: 14px;
  font-style: italic;
}

.stage {
  position: relative;
  width: min(850px, 100%);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* Gelembung lirik */
.bubble {
  position: absolute;
  bottom: -90px;
  width: max-content;
  max-width: min(78%, 570px);
  padding: 13px 21px;

  border: 1px solid rgba(255, 220, 225, .32);
  border-radius: 24px;

  background: rgba(255, 235, 238, .14);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  box-shadow: 0 5px 25px rgba(0, 0, 0, .18);

  color: #fff4f5;
  font-family: Arial, sans-serif;
  font-size: clamp(14px, 2.5vw, 19px);
  line-height: 1.5;
  text-align: center;
  overflow-wrap: anywhere;

  transform: translateX(-50%);
  will-change: transform;
}

.bubble::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 13px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,.4);
}

/* Kontrol */
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px 0 4px;
  flex-shrink: 0;
}

button {
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 30px;
  padding: 10px 23px;
  color: white;
  background: rgba(255,255,255,.12);
  font-size: 13px;
  cursor: pointer;
  transition: background .2s;
}

button:hover {
  background: rgba(255,255,255,.25);
}

button:active {
  transform: scale(.96);
}

.progress {
  width: min(300px, 80%);
  height: 3px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(255,255,255,.2);
  flex-shrink: 0;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffc1ca;
}

.time {
  margin-top: 7px;
  color: #eeb9c0;
  font: 11px Arial, sans-serif;
  flex-shrink: 0;
}

/* Salju */
.snow {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.flake {
  position: absolute;
  top: -15px;
  color: white;
  opacity: .55;
  animation: snowfall linear infinite;
}

@keyframes snowfall {
  to {
    transform: translateY(110vh) translateX(35px);
  }
}

@media (max-height: 600px) {
  .container {
    padding-top: 15px;
  }

  .heading h1 {
    font-size: 30px;
  }

  .heading {
    margin-bottom: 8px;
  }
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<main class="container">

  <header class="heading">
    <h1>Merry Christmas</h1>
    <p class="song">PLEASE DON'T CALL</p>
    <p class="artist">by Bleachers</p>
  </header>

  <section class="stage" id="stage"></section>

  <div class="progress">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="time" id="time">00:00 / 00:28</div>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="pause()">Ⅱ Pause</button>
    <button onclick="restart()">↻ Restart</button>
  </div>

</main>

<script>

/* =================================
   DATA LIRIK DAN TIMESTAMP
================================= */

const lyrics = [
  ["I would rather burn forever", 1, 3],
  ["But you should know", 3, 5],
  ["that I died slow", 5, 8],
  ["Running through the halls of your haunted home", 8, 12],
  ["And the toughest part", 12, 14],
  ["is that we both know", 14, 16],
  ["What happened to you", 16, 18],
  ["Why you're out on your own", 18, 21],
  ["Merry Christmas", 21, 23],
  ["please don't call", 23, 28]
];

const totalDuration = 28;

/* =================================
   ELEMENT
================================= */

const stage = document.getElementById("stage");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("time");
const playBtn = document.getElementById("playBtn");

let startTime = 0;
let elapsed = 0;
let running = false;
let finished = false;
let animationFrame = null;
let nextLyric = 0;

const activeAnimations = [];

/* =================================
   FORMAT WAKTU
================================= */

function formatTime(seconds) {
  return "00:" + String(Math.floor(seconds)).padStart(2, "0");
}

/* =================================
   POSISI GELEMBUNG
================================= */

const positions = [
  { left: "20%", drift: "-15px" },
  { left: "78%", drift: "15px" },
  { left: "48%", drift: "-10px" },
  { left: "28%", drift: "12px" },
  { left: "75%", drift: "-12px" },
  { left: "52%", drift: "15px" }
];

let lastPosition = -1;

function getPosition() {
  let index;

  do {
    index = Math.floor(Math.random() * positions.length);
  } while (index === lastPosition);

  lastPosition = index;
  return positions[index];
}

/* =================================
   MEMBUAT GELEMBUNG
================================= */

function createBubble(text, duration) {
  const bubble = document.createElement("div");

  bubble.className = "bubble";
  bubble.textContent = text;

  const position = getPosition();

  bubble.style.left = position.left;

  stage.appendChild(bubble);

  /*
    Durasi perjalanan dibuat cukup panjang
    agar gelembung bergerak lembut dan tidak
    terlalu cepat meninggalkan layar.
  */

  const travelDuration = 15000 + Math.random() * 3000;

  const animation = bubble.animate(
    [
      {
        transform: "translate(-50%, 0)"
      },
      {
        transform:
          `translate(calc(-50% + ${position.drift}), -130vh)`
      }
    ],
    {
      duration: travelDuration,
      easing: "linear",
      fill: "forwards"
    }
  );

  activeAnimations.push(animation);

  /*
    Hapus elemen setelah benar-benar selesai
    keluar dari area layar.
  */

  animation.onfinish = () => {
    bubble.remove();

    const index = activeAnimations.indexOf(animation);

    if (index !== -1) {
      activeAnimations.splice(index, 1);
    }
  };
}

/* =================================
   EFEK SALJU
================================= */

function createSnow() {
  const snow = document.getElementById("snow");

  for (let i = 0; i < 45; i++) {
    const flake = document.createElement("span");

    flake.className = "flake";
    flake.textContent = "❄";

    flake.style.left = Math.random() * 100 + "%";
    flake.style.fontSize = (8 + Math.random() * 10) + "px";
    flake.style.animationDuration =
      (7 + Math.random() * 10) + "s";
    flake.style.animationDelay =
      (Math.random() * 10) + "s";

    snow.appendChild(flake);
  }
}

createSnow();

/* =================================
   UPDATE TIMING LIRIK
================================= */

function update() {
  if (!running) return;

  elapsed = (Date.now() - startTime) / 1000;

  /*
    Lirik muncul tepat berdasarkan timestamp.
    Tidak menunggu animasi sebelumnya selesai.
  */

  while (
    nextLyric < lyrics.length &&
    elapsed >= lyrics[nextLyric][1]
  ) {
    const [text, start, end] = lyrics[nextLyric];

    createBubble(text, end - start);

    nextLyric++;
  }

  const percentage = Math.min(
    elapsed / totalDuration * 100,
    100
  );

  progress.style.width = percentage + "%";

  timeDisplay.textContent =
    formatTime(Math.min(elapsed, totalDuration)) +
    " / 00:28";

  if (elapsed >= totalDuration) {
    elapsed = totalDuration;
    running = false;
    finished = true;

    playBtn.textContent = "▶ Play";
    return;
  }

  animationFrame = requestAnimationFrame(update);
}

/* =================================
   PLAY
================================= */

function play() {
  if (running || finished) return;

  running = true;

  startTime = Date.now() - elapsed * 1000;

  activeAnimations.forEach(animation => {
    animation.play();
  });

  playBtn.textContent = "▶ Playing";

  update();
}

/* =================================
   PAUSE
================================= */

function pause() {
  if (!running) return;

  elapsed = (Date.now() - startTime) / 1000;

  running = false;

  cancelAnimationFrame(animationFrame);

  activeAnimations.forEach(animation => {
    animation.pause();
  });

  playBtn.textContent = "▶ Play";
}

/* =================================
   RESTART
================================= */

function restart() {
  running = false;
  finished = false;

  cancelAnimationFrame(animationFrame);

  activeAnimations.forEach(animation => {
    animation.cancel();
  });

  activeAnimations.length = 0;

  stage.innerHTML = "";

  elapsed = 0;
  nextLyric = 0;
  lastPosition = -1;

  progress.style.width = "0%";
  timeDisplay.textContent = "00:00 / 00:28";

  playBtn.textContent = "▶ Play";

  play();
}

</script>

</body>
</html>
